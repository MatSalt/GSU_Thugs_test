<head>
    <title>AI 채팅</title>
    <style>
        #chat-container {
            width: 500px;
            height: 600px;
            margin: 0 auto;
        }
        #chat-messages {
            height: 450px;
            border: 1px solid #ccc;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }
        #user-input {
            width: 80%;
            padding: 5px;
        }
        .message {
            margin: 5px 0;
            padding: 5px;
            border-radius: 5px;
        }
        .user-message {
            background-color: #e3f2fd;
            margin-left: 20%;
        }
        .ai-message {
            background-color: #f5f5f5;
            margin-right: 20%;
        }
        #user-info-container {
            background-color: #f0f8ff;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        #show-info-button {
            display: none;  /* 초기에는 버튼 숨김 */
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        #show-info-button:hover {
            background-color: #45a049;
        }

        .info-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .info-popup-close {
            position: absolute;
            right: 10px;
            top: 10px;
            cursor: pointer;
            font-size: 20px;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="user-info-container">
            <h3>사용자 정보</h3>
            <p>이름: <span id="user-name">아직 입력되지 않음</span></p>
            <p>주소: <span id="user-address">아직 입력되지 않음</span></p>
        </div>
        <button id="show-info-button" onclick="showUserInfo()">저장된 정보 보기</button>
        <div id="chat-messages"></div>
        <input type="text" id="user-input" placeholder="메시지를 입력하세요...">
        <button onclick="sendMessage()">전송</button>
        <button onclick="clearHistory()">대화 초기화</button>
    </div>

    <!-- 팝업 창 -->
    <div class="overlay" id="overlay"></div>
    <div class="info-popup" id="info-popup">
        <span class="info-popup-close" onclick="closePopup()">&times;</span>
        <h2>저장된 사용자 정보</h2>
        <p><strong>이름:</strong> <span id="popup-name"></span></p>
        <p><strong>주소:</strong> <span id="popup-address"></span></p>
    </div>

    <script>
        const API_URL = '';

        // 사용자 정보 업데이트 함수
        async function updateUserInfo() {
            try {
                const response = await fetch(`${API_URL}/user-info`);
                const data = await response.json();
                
                const name = data.name || '아직 입력되지 않음';
                const address = data.address || '아직 입력되지 않음';
                
                document.getElementById('user-name').textContent = name;
                document.getElementById('user-address').textContent = address;
                
                // 이름과 주소가 모두 있으면 버튼 표시
                const showInfoButton = document.getElementById('show-info-button');
                if (data.name && data.address) {
                    showInfoButton.style.display = 'block';
                } else {
                    showInfoButton.style.display = 'none';
                }
            } catch (error) {
                console.error('Error fetching user info:', error);
            }
        }

        // 사용자 정보 팝업 표시
        function showUserInfo() {
            const name = document.getElementById('user-name').textContent;
            const address = document.getElementById('user-address').textContent;
            
            document.getElementById('popup-name').textContent = name;
            document.getElementById('popup-address').textContent = address;
            
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('info-popup').style.display = 'block';
        }

        // 팝업 닫기
        function closePopup() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('info-popup').style.display = 'none';
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            
            if (!message) return;

            // 사용자 메시지 표시
            addMessage(message, 'user');
            input.value = '';

            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                // AI 응답 표시
                addMessage(data.response, 'ai');
                
                // 메시지 전송 후 사용자 정보 업데이트
                await updateUserInfo();
            } catch (error) {
                console.error('Error:', error);
                addMessage('오류가 발생했습니다.', 'ai');
            }
        }

        function addMessage(message, sender) {
            const messagesDiv = document.getElementById('chat-messages');
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', `${sender}-message`);
            messageElement.textContent = message;
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function clearHistory() {
            try {
                await fetch(`${API_URL}/clear`, { method: 'POST' });
                document.getElementById('chat-messages').innerHTML = '';
                await updateUserInfo();
                document.getElementById('show-info-button').style.display = 'none';
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Enter 키로 메시지 전송
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 페이지 로드 시 사용자 정보 표시
        updateUserInfo();

        // 오버레이 클릭 시 팝업 닫기
        document.getElementById('overlay').addEventListener('click', closePopup);
    </script>
</body>
</html>
